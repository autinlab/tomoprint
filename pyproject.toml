[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomoprint"
version = "0.1.0"
description = "Convert cryo-ET tomograms into watertight, 3D-printable relief plates"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Quentin Tallon", email = "qtallon@scripps.edu" }]
keywords = ["cryo-et", "tomogram", "mrc", "3d-printing", "mesh", "relief"]
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.13,<2",
  "mrcfile>=1.5,<2",
  "scikit-image>=0.24,<0.27",
  "trimesh>=4.4,<5",
  "fast-simplification>=0.1",
  "typer>=0.12",
]

[project.optional-dependencies]
viz = ["pyvista>=0.45,<0.46", "vtk>=9.3,<9.7"]
gui = ["PySide6>=6.7,<6.10", "pyvistaqt>=0.11,<0.12", "pyvista>=0.45,<0.46", "vtk>=9.3,<9.7"]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["tomoprint[viz,gui,test]", "ruff>=0.6", "build", "ipython"]

[project.scripts]
tomoprint = "tomoprint.cli:main"
tomoprint-gui = "tomoprint.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tomoprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end / real-MRC tests (deselect with -m 'not slow')",
  "needs_data: requires data/*.mrc present",
  "gui: requires PySide6 (auto-skipped if not installed)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
