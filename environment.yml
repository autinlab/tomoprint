  - numpy>=1.26,<2.3
  - scipy>=1.13,<2
  - mrcfile>=1.5,<2
  - scikit-image>=0.24,<0.27
  - vtk>=9.3,<9.7
  - pyvista>=0.45,<0.46
  - pyvistaqt>=0.11,<0.12
  - pyside6>=6.7,<6.10
